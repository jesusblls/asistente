## Despliegue de un solo VPS: Postgres y Redis corren como contenedores junto
## a la API y el panel.
##
## VPS dedicado (Caddy propio incluido aquí, entrada única en 80/443):
##   cp deploy/.env.production.example deploy/.env.production   # y ajusta los valores reales
##   docker compose --env-file deploy/.env.production --profile standalone up -d --build
##
## VPS compartido con un reverse proxy que ya administras (Caddy/Traefik/etc.
## ya tiene el 80/443 tomado por otros proyectos): usa el override que no
## trae Caddy propio y conecta api/web a tu red externa —
## ver deploy/docker-compose.proxy-externo.yml y deploy/README.md.
##   docker compose --env-file deploy/.env.production \
##     -f docker-compose.yml -f deploy/docker-compose.proxy-externo.yml \
##     up -d --build

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asistente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-asistente}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asistente}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Todas las variables de deploy/.env.production llegan a la API tal cual.
    # Antes se listaban una por una aquí, y la lista se quedó atrás del código
    # dos veces: la API de producción dejó de recibir DEEPSEEK_API_KEY, las
    # credenciales de SignalWire, MERCADOPAGO_PLATFORM_ACCESS_TOKEN y
    # VOICE_STREAM_TOKEN sin que nada lo avisara — simplemente corría en modo
    # simulación. Con env_file, agregar una variable nueva es solo agregarla
    # al archivo.
    env_file:
      - deploy/.env.production
    # `environment` gana sobre `env_file`: aquí van solo los valores que
    # compone el propio stack (red interna de Docker) y las dos variables cuya
    # ausencia debe detener el despliegue antes de construir nada.
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-asistente}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-asistente}
      REDIS_URL: redis://redis:6379
      # Detrás de Caddy: sin esto, la auditoría y el rate limit ven la IP del
      # proxy para todo mundo en vez de la del cliente real.
      TRUST_PROXY: "true"
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env.production (32+ caracteres aleatorios)}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?Define CREDENTIALS_ENCRYPTION_KEY en .env.production (openssl rand -base64 32)}
    expose:
      - "3000"
    # Sin healthcheck, Docker da la API por "lista" en cuanto arranca el
    # proceso, aunque siga aplicando migraciones o se haya caído al validar
    # variables. Se usa node (no curl/wget): la imagen es node:22-slim y no
    # trae ninguno de los dos. 127.0.0.1 porque el chequeo corre dentro del
    # propio contenedor. start_period amplio: `prisma migrate deploy` corre
    # antes de que el servidor escuche, y en ese lapso los fallos no cuentan.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Debe ir como build-arg, no como `environment:` de runtime: Next
        # congela el rewrite /api/* -> API dentro de la imagen durante
        # `next build` (ver apps/web/Dockerfile). El navegador nunca ve esta
        # URL; solo la usa el servidor de Next para reenviar por la red
        # interna de Docker.
        API_PROXY_TARGET: http://api:3000
    restart: unless-stopped
    # Esperar a que la API responda /health, no solo a que su contenedor
    # exista: si no, el panel queda arriba proxeando /api/* y /auth/* a una
    # API que todavía está migrando y el login falla con 502 los primeros
    # segundos de cada despliegue.
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    # Solo se levanta en un VPS dedicado (--profile standalone). En un VPS
    # compartido con un reverse proxy propio, este servicio se omite y
    # deploy/docker-compose.proxy-externo.yml conecta api/web a esa red en
    # su lugar — ver deploy/README.md.
    profiles: ["standalone"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
