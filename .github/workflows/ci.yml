name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Commit Messages
        run: |
          chmod +x .githooks/commit-msg
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD)
            for commit in $COMMITS; do
              MSG_FILE=$(mktemp)
              git log -1 --format=%B "$commit" > "$MSG_FILE"
              echo "Validando commit: $commit"
              .githooks/commit-msg "$MSG_FILE"
              rm -f "$MSG_FILE"
            done
          else
            MSG_FILE=$(mktemp)
            git log -1 --format=%B HEAD > "$MSG_FILE"
            echo "Validando HEAD: $(git rev-parse HEAD)"
            .githooks/commit-msg "$MSG_FILE"
            rm -f "$MSG_FILE"
          fi

  lint-and-typecheck:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages (Prisma & Workspaces)
        run: |
          npm run build --workspace=@asistente/database
          npm run build

      - name: Lint web
        run: npm run lint --workspace=apps/web

  test:
    name: Test Suites
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Database & Packages
        run: |
          npm run build --workspace=@asistente/database
          npm run build

      - name: Run Test Suites
        run: npm run test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-with-at-least-32-characters
          CREDENTIALS_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
